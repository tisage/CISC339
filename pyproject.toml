[project]
name = "cisc339"
version = "0.1.0"
description = "CISC339 course notebooks and supporting scripts - shared environment for all labs."
requires-python = ">=3.12"
dependencies = [
    # ── Lab03: multi-agent LLM Mafia demo ──────────────────────────────
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "ipywidgets>=8.1.0",
    # ── Lab04: probability/inference notebooks + network-data generator ─
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pgmpy>=0.1.26",
    "hmmlearn>=0.3.2",
    "networkx>=3.3",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "numpy>=1.26.0",
    # ── Lab07: PyTorch applied demos ───────────────────────────────────
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "transformers>=4.30.0",
    "pillow>=9.5.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
]

[tool.uv]
package = false
